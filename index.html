<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f59e0b">
  <meta name="description" content="Origo Breakfast Food Court billing, coupons, inventory and reports">
  <title>Origo Breakfast Food Court</title>
  <style>


:root {
  --bg: #f5f7fb;
  --surface: #ffffff;
  --surface-soft: #fffaf0;
  --ink: #172033;
  --muted: #6d778a;
  --line: #e5e9f0;
  --primary: #f59e0b;
  --primary-dark: #c76805;
  --primary-soft: #fff1d0;
  --green: #159570;
  --green-soft: #e3f7ef;
  --blue: #3568d4;
  --blue-soft: #e9efff;
  --red: #d93c50;
  --red-soft: #ffeaed;
  --purple: #7b57c7;
  --shadow: 0 12px 30px rgba(30, 41, 59, .07);
  --radius: 18px;
  --radius-sm: 12px;
  --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Devanagari", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); }
body { min-width: 320px; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .52; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid rgba(53, 104, 212, .42); outline-offset: 2px; }

.app-shell { min-height: 100vh; }
.topbar {
  height: 76px;
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 12px 28px;
  background: rgba(255,255,255,.94);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(12px);
}
.brand { display:flex; align-items:center; gap:12px; min-width: 0; }
.brand-mark {
  width: 44px; height: 44px; flex: 0 0 44px; border-radius: 14px;
  display:grid; place-items:center; background: linear-gradient(145deg, #ffc34e, #ec8a0a);
  color: white; box-shadow: 0 7px 15px rgba(245,158,11,.27); overflow:hidden;
  font-size: 24px;
}
.brand-mark img { width:100%; height:100%; object-fit:cover; }
.brand-copy { min-width:0; }
.brand-name { font-size: 17px; line-height:1.15; font-weight: 800; letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.brand-subtitle { font-size: 11px; color: var(--muted); margin-top: 3px; white-space:nowrap; }
.top-actions { display:flex; align-items:center; gap: 10px; }
.lang-toggle { display:flex; background:#f1f3f7; padding:3px; border-radius: 10px; gap:2px; }
.lang-toggle button { border:0; background:transparent; border-radius:8px; padding:8px 11px; color:var(--muted); font-weight:700; font-size:12px; }
.lang-toggle button.active { background:#fff; color:var(--ink); box-shadow:0 2px 7px rgba(23,32,51,.10); }
.user-chip { display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:999px; padding:7px 10px 7px 8px; background:#fff; }
.user-avatar { display:grid; place-items:center; width:29px; height:29px; border-radius:50%; background:var(--blue-soft); color:var(--blue); font-size:14px; }
.user-name { font-weight:800; font-size:12px; }
.user-role { color:var(--muted); font-size:10px; margin-top:1px; }

.app-layout { display:grid; grid-template-columns: 238px minmax(0,1fr); min-height: calc(100vh - 76px); }
.sidebar { background:#fff; border-right:1px solid var(--line); padding:20px 14px; display:flex; flex-direction:column; gap:12px; }
.nav-label { color:#9ba4b2; font-size:10px; text-transform:uppercase; letter-spacing:.12em; font-weight:800; padding:12px 12px 6px; }
.nav-list { display:flex; flex-direction:column; gap:4px; }
.nav-button { border:0; background:transparent; color:var(--muted); width:100%; display:flex; align-items:center; gap:11px; padding:12px; border-radius:12px; text-align:left; font-weight:700; font-size:13px; min-height:46px; }
.nav-button:hover { background:#f8f9fc; color:var(--ink); }
.nav-button.active { color:var(--primary-dark); background:var(--primary-soft); }
.nav-button .nav-icon { width:24px; text-align:center; font-size:19px; }
.nav-button .nav-lock { margin-left:auto; font-size:11px; opacity:.65; }
.sidebar-foot { margin-top:auto; border-top:1px solid var(--line); padding:14px 10px 2px; }
.connection-note { display:flex; gap:9px; font-size:11px; color:var(--muted); line-height:1.45; }
.connection-dot { width:8px; height:8px; flex:0 0 8px; margin-top:4px; border-radius:50%; background:var(--green); box-shadow:0 0 0 4px var(--green-soft); }
.cloud-dot-online { background:var(--green); box-shadow:0 0 0 4px var(--green-soft); }
.cloud-dot-error { background:var(--red); box-shadow:0 0 0 4px var(--red-soft); }
.cloud-badge { display:inline-flex; align-items:center; gap:6px; min-height:31px; padding:7px 9px; border-radius:999px; font-size:10px; font-weight:800; white-space:nowrap; }
.cloud-badge-dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
.cloud-online { color:var(--green); background:var(--green-soft); }
.cloud-local { color:var(--muted); background:#f1f3f7; }
.cloud-error { color:var(--red); background:var(--red-soft); }
.main-content { padding: 28px clamp(18px, 4vw, 48px) 55px; overflow:hidden; }
.page { max-width: 1500px; margin:0 auto; }
.page-header { display:flex; justify-content:space-between; align-items:flex-start; gap:18px; margin-bottom:24px; }
.eyebrow { text-transform:uppercase; letter-spacing:.12em; font-size:10px; font-weight:900; color:var(--primary-dark); margin:0 0 7px; }
.page-title { margin:0; font-size:clamp(24px,3vw,34px); line-height:1.06; letter-spacing:-.04em; }
.page-description { color:var(--muted); font-size:13px; margin:8px 0 0; max-width:700px; line-height:1.5; }
.header-actions { display:flex; flex-wrap:wrap; align-items:center; gap:9px; }

.btn { min-height:44px; border-radius:11px; padding:10px 15px; border:1px solid transparent; font-weight:800; font-size:12px; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition: transform .15s ease, box-shadow .15s ease, background .15s ease; }
.btn:hover:not(:disabled) { transform:translateY(-1px); }
.btn-primary { color:#fff; background:var(--primary); box-shadow:0 7px 14px rgba(245,158,11,.20); }
.btn-primary:hover:not(:disabled) { background:var(--primary-dark); }
.btn-dark { color:#fff; background:var(--ink); }
.btn-secondary { color:var(--ink); background:#fff; border-color:var(--line); }
.btn-secondary:hover:not(:disabled) { border-color:#cbd2df; background:#fafbfc; }
.btn-ghost { color:var(--muted); background:transparent; border-color:transparent; }
.btn-ghost:hover:not(:disabled) { background:#f1f3f7; color:var(--ink); }
.btn-success { color:#fff; background:var(--green); }
.btn-danger { color:var(--red); background:var(--red-soft); border-color:#ffd5da; }
.btn-small { min-height:35px; padding:7px 10px; border-radius:9px; font-size:11px; }
.btn-block { width:100%; }
.icon-btn { width:40px; min-width:40px; height:40px; padding:0; border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:10px; display:grid; place-items:center; font-size:16px; }
.icon-btn:hover { color:var(--ink); background:#f8f9fc; }

.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
.card-pad { padding:22px; }
.card-title-row { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:17px; }
.card-title { margin:0; font-weight:850; font-size:15px; letter-spacing:-.02em; }
.card-subtitle { margin:5px 0 0; color:var(--muted); font-size:11px; line-height:1.45; }
.section-title { font-size:14px; font-weight:850; margin:0 0 13px; }
.muted { color:var(--muted); }
.small { font-size:11px; }
.tiny { font-size:10px; }

.kpi-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:22px; }
.kpi-card { padding:18px; position:relative; overflow:hidden; }
.kpi-card::after { content:""; position:absolute; width:80px; height:80px; border-radius:50%; right:-27px; top:-29px; background:var(--primary-soft); opacity:.8; }
.kpi-card.green::after { background:var(--green-soft); }
.kpi-card.blue::after { background:var(--blue-soft); }
.kpi-card.red::after { background:var(--red-soft); }
.kpi-top { display:flex; align-items:center; justify-content:space-between; gap:10px; position:relative; z-index:1; }
.kpi-label { color:var(--muted); font-weight:700; font-size:11px; }
.kpi-icon { width:34px; height:34px; display:grid; place-items:center; border-radius:11px; background:var(--primary-soft); font-size:17px; }
.green .kpi-icon { background:var(--green-soft); }
.blue .kpi-icon { background:var(--blue-soft); }
.red .kpi-icon { background:var(--red-soft); }
.kpi-value { font-size:25px; letter-spacing:-.05em; font-weight:900; margin:15px 0 4px; position:relative; z-index:1; }
.kpi-foot { color:var(--muted); font-size:10px; position:relative; z-index:1; }
.dashboard-grid { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(300px,.8fr); gap:18px; }
.dashboard-left, .dashboard-right { display:flex; flex-direction:column; gap:18px; min-width:0; }
.hero-card { padding:25px; color:#fff; background:linear-gradient(132deg,#172033 0%,#293956 62%,#3c526e 100%); border:0; position:relative; overflow:hidden; }
.hero-card::before { content:""; position:absolute; width:250px; height:250px; border:28px solid rgba(255,193,74,.15); border-radius:50%; right:-85px; top:-110px; }
.hero-card::after { content:""; position:absolute; width:150px; height:150px; border:18px solid rgba(255,255,255,.06); border-radius:50%; right:105px; bottom:-106px; }
.hero-content { position:relative; z-index:1; max-width:650px; }
.hero-card .eyebrow { color:#ffc34e; }
.hero-card h2 { font-size:clamp(24px,3vw,38px); line-height:1.08; letter-spacing:-.05em; margin:0 0 10px; }
.hero-card p { color:#d4dcea; font-size:13px; line-height:1.55; max-width:560px; margin:0 0 19px; }
.hero-actions { display:flex; gap:9px; flex-wrap:wrap; }
.hero-card .btn-secondary { background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.2); color:#fff; }
.payment-bars { display:flex; flex-direction:column; gap:15px; }
.payment-line { display:flex; flex-direction:column; gap:7px; }
.payment-line-top { display:flex; justify-content:space-between; gap:10px; font-size:12px; font-weight:750; }
.payment-track { height:8px; border-radius:99px; background:#eef1f5; overflow:hidden; }
.payment-fill { height:100%; border-radius:99px; min-width:2px; background:var(--green); }
.payment-fill.upi { background:var(--blue); }
.payment-fill.due { background:var(--red); }
.quick-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.quick-action { border:1px solid var(--line); background:#fff; border-radius:13px; padding:15px; text-align:left; min-height:92px; display:flex; flex-direction:column; justify-content:space-between; gap:13px; }
.quick-action:hover { border-color:#ffd27c; box-shadow:0 7px 17px rgba(245,158,11,.11); }
.quick-icon { font-size:22px; }
.quick-label { font-weight:850; font-size:12px; }
.quick-sub { color:var(--muted); font-size:10px; margin-top:3px; }

.table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
table { width:100%; border-collapse:collapse; font-size:12px; }
th { color:#8993a3; font-size:10px; letter-spacing:.06em; text-transform:uppercase; font-weight:850; text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
td { padding:13px 12px; border-bottom:1px solid #f0f2f5; vertical-align:middle; }
tbody tr:last-child td { border-bottom:0; }
tbody tr:hover { background:#fcfcfd; }
.td-strong { font-weight:800; }
.td-right { text-align:right; }
.td-center { text-align:center; }
.status { display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:5px 8px; font-size:10px; font-weight:850; white-space:nowrap; }
.status::before { content:""; width:5px; height:5px; border-radius:50%; background:currentColor; }
.status-paid { color:var(--green); background:var(--green-soft); }
.status-due { color:var(--red); background:var(--red-soft); }
.status-partial { color:var(--primary-dark); background:var(--primary-soft); }
.status-new { color:var(--blue); background:var(--blue-soft); }
.status-served { color:var(--muted); background:#f0f2f5; }
.empty-state { padding:35px 18px; color:var(--muted); text-align:center; }
.empty-icon { font-size:28px; margin-bottom:8px; }

.billing-layout { display:grid; grid-template-columns:minmax(330px,.85fr) minmax(480px,1.45fr); gap:18px; align-items:start; }
.billing-panel { padding:20px; }
.sticky-card { position:sticky; top:95px; }
.form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px; }
.form-grid.three { grid-template-columns:repeat(3,minmax(0,1fr)); }
.form-field { display:flex; flex-direction:column; gap:6px; min-width:0; }
.form-field.full { grid-column:1/-1; }
.form-label { color:#697487; font-size:10px; text-transform:uppercase; letter-spacing:.07em; font-weight:850; }
.form-hint { color:var(--muted); font-size:10px; line-height:1.4; }
input, select, textarea { width:100%; color:var(--ink); background:#fff; border:1px solid #dfe4ec; border-radius:10px; min-height:43px; padding:10px 11px; outline:none; }
input:focus, select:focus, textarea:focus { border-color:#f5b941; box-shadow:0 0 0 3px rgba(245,185,65,.15); }
textarea { resize:vertical; min-height:78px; }
input[type="number"] { -moz-appearance:textfield; }
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
.input-with-prefix { position:relative; }
.input-with-prefix > span { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--muted); font-weight:800; font-size:12px; }
.input-with-prefix input { padding-left:27px; }
.divider { height:1px; background:var(--line); margin:19px 0; }
.cart-list { display:flex; flex-direction:column; gap:9px; min-height:64px; max-height:400px; overflow-y:auto; padding-right:2px; }
.cart-row { display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:10px; align-items:center; padding:11px 0; border-bottom:1px dashed #e7eaf0; }
.cart-row:last-child { border-bottom:0; }
.cart-item-name { font-weight:800; font-size:12px; line-height:1.25; }
.cart-item-meta { color:var(--muted); font-size:10px; margin-top:4px; }
.qty-control { display:flex; align-items:center; gap:5px; border:1px solid var(--line); border-radius:9px; padding:3px; }
.qty-control button { border:0; background:#f6f7f9; color:var(--ink); width:28px; height:28px; border-radius:7px; font-size:17px; line-height:1; }
.qty-control button:hover { background:var(--primary-soft); }
.qty-control span { min-width:20px; text-align:center; font-size:12px; font-weight:850; }
.cart-price { font-size:12px; font-weight:850; min-width:58px; text-align:right; }
.cart-remove { border:0; color:#a5adbb; background:transparent; font-size:14px; padding:3px; }
.cart-remove:hover { color:var(--red); }
.menu-toolbar { display:flex; align-items:center; gap:9px; margin-bottom:15px; flex-wrap:wrap; }
.menu-search { flex:1; min-width:180px; position:relative; }
.menu-search input { padding-left:37px; }
.menu-search span { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); }
.category-pills { display:flex; gap:5px; flex-wrap:wrap; }
.pill { border:1px solid var(--line); color:var(--muted); background:#fff; padding:8px 11px; border-radius:999px; font-size:11px; font-weight:800; }
.pill.active { background:var(--ink); color:#fff; border-color:var(--ink); }
.menu-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:11px; }
.menu-item { display:flex; flex-direction:column; justify-content:space-between; min-height:128px; padding:14px; border:1px solid var(--line); background:#fff; border-radius:14px; text-align:left; transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease; }
.menu-item:hover { transform:translateY(-2px); border-color:#f7c667; box-shadow:0 7px 16px rgba(245,158,11,.12); }
.menu-item:active { transform:scale(.98); }
.menu-item-top { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
.menu-item-icon { width:33px; height:33px; display:grid; place-items:center; border-radius:10px; background:var(--surface-soft); font-size:17px; }
.menu-item-icon.beverage { background:var(--blue-soft); }
.menu-item-category { font-size:9px; text-transform:uppercase; color:var(--muted); letter-spacing:.07em; font-weight:850; }
.menu-item-name { font-weight:850; font-size:12px; line-height:1.3; margin-top:10px; }
.menu-item-mr { font-size:11px; color:var(--muted); margin-top:3px; line-height:1.35; }
.menu-item-bottom { display:flex; justify-content:space-between; align-items:center; gap:6px; margin-top:13px; }
.menu-item-price { font-weight:900; font-size:13px; }
.add-mark { width:27px; height:27px; display:grid; place-items:center; background:var(--primary); color:#fff; border-radius:8px; font-size:17px; font-weight:500; }
.bill-totals { display:flex; flex-direction:column; gap:9px; }
.total-line { display:flex; justify-content:space-between; gap:12px; font-size:12px; color:var(--muted); }
.total-line strong { color:var(--ink); }
.total-line.grand { font-size:17px; color:var(--ink); font-weight:900; padding-top:11px; margin-top:2px; border-top:1px solid var(--line); }
.total-line.grand strong { font-size:21px; letter-spacing:-.04em; }
.payment-switch { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
.payment-option { position:relative; }
.payment-option input { position:absolute; opacity:0; pointer-events:none; }
.payment-option label { display:flex; align-items:center; gap:8px; justify-content:center; border:1px solid var(--line); border-radius:10px; padding:11px; min-height:43px; font-size:12px; font-weight:850; color:var(--muted); cursor:pointer; }
.payment-option input:checked + label { color:var(--ink); border-color:var(--primary); background:var(--primary-soft); }
.pay-status-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; }
.checkbox-label { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:11px; font-weight:750; cursor:pointer; }
.checkbox-label input { width:17px; height:17px; min-height:0; accent-color:var(--primary); }
.change-box { margin-top:11px; border-radius:11px; padding:11px 13px; background:var(--green-soft); color:var(--green); display:flex; justify-content:space-between; gap:10px; font-weight:850; font-size:12px; }
.due-box { background:var(--red-soft); color:var(--red); }
.bill-actions { display:flex; gap:9px; margin-top:18px; }
.bill-actions .btn { flex:1; }
.shortcut-note { text-align:center; color:var(--muted); font-size:10px; margin-top:11px; }

.inventory-grid { display:grid; grid-template-columns:minmax(250px,.7fr) minmax(0,1.8fr); gap:18px; align-items:start; }
.inventory-form { padding:20px; position:sticky; top:95px; }
.inventory-form .form-grid { grid-template-columns:1fr; }
.inventory-table td input { min-height:34px; padding:6px 7px; font-size:11px; width:100px; }
.stock-meter { width:90px; height:7px; background:#eef1f5; border-radius:99px; overflow:hidden; display:inline-block; vertical-align:middle; margin-right:6px; }
.stock-meter i { display:block; height:100%; border-radius:99px; background:var(--green); }
.stock-meter i.low { background:var(--primary); }
.stock-meter i.out { background:var(--red); }

.report-filter { padding:18px; margin-bottom:18px; }
.report-filter-grid { display:grid; grid-template-columns:1.1fr 1.1fr 1fr 1.1fr auto; gap:10px; align-items:end; }
.report-filter .btn { min-height:43px; }
.report-summary { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:11px; margin-bottom:18px; }
.report-stat { padding:14px 15px; border:1px solid var(--line); border-radius:13px; background:#fff; }
.report-stat-label { font-size:10px; color:var(--muted); font-weight:800; }
.report-stat-value { font-size:19px; font-weight:900; margin-top:8px; letter-spacing:-.04em; }
.report-tabs { display:flex; gap:5px; flex-wrap:wrap; }
.report-tab { border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:999px; padding:8px 12px; font-size:11px; font-weight:800; }
.report-tab.active { background:var(--blue); color:#fff; border-color:var(--blue); }
.export-actions { display:flex; gap:7px; flex-wrap:wrap; }

.settings-grid { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr); gap:18px; align-items:start; }
.settings-column { display:flex; flex-direction:column; gap:18px; min-width:0; }
.settings-card { padding:21px; }
.logo-upload { display:flex; align-items:center; gap:14px; padding:12px; background:#fafbfc; border:1px dashed #d8dee8; border-radius:12px; }
.logo-preview { width:60px; height:60px; border-radius:15px; display:grid; place-items:center; overflow:hidden; background:linear-gradient(145deg,#ffc34e,#ec8a0a); color:#fff; font-size:27px; flex:0 0 60px; }
.logo-preview img { width:100%; height:100%; object-fit:cover; }
.logo-upload-copy { flex:1; min-width:0; }
.logo-upload-copy strong { display:block; font-size:12px; }
.logo-upload-copy span { display:block; font-size:10px; color:var(--muted); margin-top:4px; line-height:1.4; }

function makeDefaultState() {
  return {
    version: APP_VERSION,
    settings: defaultSettings(),
    menu: DEFAULT_MENU.map(item => ({ ...item })),
    inventory: DEFAULT_INVENTORY.map(item => ({ ...item })),
    bills: [],
    inventoryReview: { lastAt: null, lastBillCount: 0 },
    inventoryUsageLog: [],
    nextBillSeq: 1,
    nextCouponSeq: 1
  };
}

function loadState() {
  const fresh = makeDefaultState();
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return fresh;
    const parsed = JSON.parse(raw);
    return {
      ...fresh,
      ...parsed,
      settings: { ...fresh.settings, ...(parsed.settings || {}) },
      menu: Array.isArray(parsed.menu) ? parsed.menu : fresh.menu,
      inventory: Array.isArray(parsed.inventory) ? parsed.inventory : fresh.inventory,
      bills: Array.isArray(parsed.bills) ? parsed.bills : [],
      inventoryReview: { ...fresh.inventoryReview, ...(parsed.inventoryReview || {}) },
      inventoryUsageLog: Array.isArray(parsed.inventoryUsageLog) ? parsed.inventoryUsageLog : [],
      nextBillSeq: Number(parsed.nextBillSeq) || 1,
      nextCouponSeq: Number(parsed.nextCouponSeq) || 1
    };
  } catch (error) {
    console.warn('Could not load saved data', error);
    return fresh;
  }
}

function t(key) {
  const lang = state.settings.language === 'mr' ? 'mr' : 'en';
  return (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
}

function esc(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function number(value, fallback = 0) {
  const n = Number(value);
  return Number.isFinite(n) ? n : fallback;
}

function money(value) {
  return `₹${number(value).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
}

function plainMoney(value) {
  return number(value).toFixed(2);
}

function todayIso() {
  const now = new Date();
  const offset = now.getTimezoneOffset();
  return new Date(now.getTime() - offset * 60000).toISOString().slice(0, 10);
}

function firstDayOfMonthIso() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;
}

function isoDate(value) {
  if (!value) return '';
  return String(value).slice(0, 10);
}

function displayDate(value, withTime = false) {
  if (!value) return '—';
  const date = new Date(value.includes('T') ? value : `${value}T00:00:00`);
  if (Number.isNaN(date.getTime())) return value;
  return new Intl.DateTimeFormat(state.settings.language === 'mr' ? 'mr-IN' : 'en-IN', withTime
    ? { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }
    : { day: '2-digit', month: 'short', year: 'numeric' }).format(date);
}

function displayName(item) {
  if (!item) return '';
  return state.settings.language === 'mr' ? (item.nameMr || item.nameEn) : (item.nameEn || item.nameMr);
}

function categoryLabel(category) {
  return category === 'beverage' ? t('beverage') : t('food');
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (error) {
    console.warn('Could not save data', error);
    showToast('Storage is full. Download a backup and remove old data.', 'error');
  }

  // Firebase is an optional mirror. Local storage remains the immediate write
  // path so the counter never blocks on a weak connection.
  if (!applyingRemoteState && window.OrigoFirebase?.connected) {
    window.OrigoFirebase.saveState(state).then(() => {
      cloudSync.lastSync = new Date().toISOString();
      cloudSync.status = 'connected';
    }).catch(error => {
      cloudSync.status = 'error';
      cloudSync.error = error?.message || 'Cloud save failed.';
      console.warn('Firebase save failed; local data is still safe.', error);
      render();
    });
  }
}

function getMenuItem(id) {

function calculateBilling() {
  const cartItems = billingDraft.cart.map(line => {
    const item = getMenuItem(line.id);
    if (!item) return null;
    const qty = Math.max(1, Math.floor(number(line.qty, 1)));
    return { ...item, qty, lineTotal: number(item.price) * qty };
  }).filter(Boolean);
  const subtotal = cartItems.reduce((sum, item) => sum + item.lineTotal, 0);
  const rawDiscount = billingDraft.discount === '' ? number(state.settings.defaultDiscount) : number(billingDraft.discount);
  const discount = Math.min(Math.max(rawDiscount, 0), subtotal);
  const taxable = Math.max(subtotal - discount, 0);
  const gstRate = Math.max(number(state.settings.gstTax), 0);
  const gst = taxable * gstRate / 100;
  const total = taxable + gst;
  let received;
  if (billingDraft.payLater) received = 0;
  else if (billingDraft.paymentMode === 'upi') received = total;
  else if (billingDraft.amountReceived === '') received = total;
  else received = Math.max(number(billingDraft.amountReceived), 0);
  const change = Math.max(received - total, 0);
  const due = Math.max(total - received, 0);
  const status = due <= 0.005 ? 'paid' : (received > 0 ? 'partial' : 'due');
  return { cartItems, subtotal, discount, taxable, gstRate, gst, total, received, change, due, status };
}

function inventoryReviewStatus() {
  const review = state.inventoryReview || { lastAt: null, lastBillCount: 0 };
  const billsSince = Math.max(0, state.bills.length - number(review.lastBillCount));
  const elapsedHours = review.lastAt ? Math.max(0, (Date.now() - new Date(review.lastAt).getTime()) / 3600000) : 999;
  const due = !review.lastAt || elapsedHours >= 4 || billsSince >= 50;
  const hoursLeft = due ? 0 : Math.max(0, Math.ceil(4 - elapsedHours));
  return { due, billsSince, hoursLeft, lastAt: review.lastAt };
}

function saveInventoryUsageForm(form) {
  const usedItems = [];
  state.inventory = state.inventory.map(raw => {
    const used = Math.min(Math.max(number(form.elements[`used-${raw.id}`]?.value, 0), 0), Math.max(number(raw.remainingQty), 0));
    if (used > 0) usedItems.push({ id: raw.id, nameEn: raw.nameEn, nameMr: raw.nameMr, unit: raw.unit, usedQty: used, remainingQty: Math.max(0, number(raw.remainingQty) - used) });
    return used > 0 ? { ...raw, remainingQty: Math.max(0, number(raw.remainingQty) - used) } : raw;
  });
  state.inventoryReview = { lastAt: new Date().toISOString(), lastBillCount: state.bills.length };
  if (!Array.isArray(state.inventoryUsageLog)) state.inventoryUsageLog = [];
  state.inventoryUsageLog.unshift({ at: state.inventoryReview.lastAt, bills: state.bills.length, items: usedItems });
  state.inventoryUsageLog = state.inventoryUsageLog.slice(0, 20);
  saveState(); render(); showToast(usedItems.length ? 'Stock usage saved.' : 'Stock check completed.', 'success');
}

function adjustInventory(id, delta) {
  const item = state.inventory.find(raw => raw.id === id);
  if (!item) return;
  const amount = number(delta);
  const before = Math.max(0, number(item.remainingQty));
  const after = Math.max(0, before + amount);
  const used = Math.max(0, before - after);
  item.remainingQty = after;
  if (amount > 0) item.purchasedQty = Math.max(number(item.purchasedQty), after);
  state.inventoryReview = { lastAt: new Date().toISOString(), lastBillCount: state.bills.length };
  if (used > 0) {
    if (!Array.isArray(state.inventoryUsageLog)) state.inventoryUsageLog = [];
    state.inventoryUsageLog.unshift({ at: state.inventoryReview.lastAt, bills: state.bills.length, items: [{ id: item.id, nameEn: item.nameEn, nameMr: item.nameMr, unit: item.unit, usedQty: used, remainingQty: after }] });
    state.inventoryUsageLog = state.inventoryUsageLog.slice(0, 20);
  }
  saveState(); render(); showToast(`${item.nameEn}: ${amount < 0 ? 'used' : 'added'} ${Math.abs(amount)} ${item.unit}`, 'success');
}

function reportRangeFromPreset(preset) {
  const today = new Date(`${todayIso()}T00:00:00`);
  if (preset === 'today') return { from: todayIso(), to: todayIso() };
  if (preset === 'week') {
    const day = today.getDay() || 7;
    const monday = new Date(today);
    monday.setDate(today.getDate() - day + 1);
    return { from: toIso(monday), to: todayIso() };
  }
  if (preset === 'year') return { from: `${today.getFullYear()}-01-01`, to: todayIso() };
  return { from: firstDayOfMonthIso(), to: todayIso() };
}

function toIso(date) {
  const offset = date.getTimezoneOffset();
  return new Date(date.getTime() - offset * 60000).toISOString().slice(0, 10);
}

function getReportData() {
  const from = reportState.from || '0000-01-01';
  const to = reportState.to || '9999-12-31';
  const bills = state.bills.filter(bill => {
    const date = isoDate(bill.date || bill.createdAt);
    return date >= from && date <= to;
  }).sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.createdAt).localeCompare(String(a.createdAt)));
  const summary = {
    count: bills.length,
    gross: bills.reduce((s,b) => s + number(b.grandTotal), 0),
    received: bills.reduce((s,b) => s + number(b.amountReceived), 0),
    due: bills.reduce((s,b) => s + number(b.due), 0),
    tax: bills.reduce((s,b) => s + number(b.gstAmount), 0),
    discounts: bills.reduce((s,b) => s + number(b.discount), 0)
  };
  let rows = [];
  if (reportState.type === 'products' || reportState.type === 'beverages') {
    const map = new Map();
    bills.forEach(bill => bill.items.forEach(item => {
      if (reportState.type === 'beverages' && item.category !== 'beverage') return;
      const key = item.menuId || item.nameEn;
      if (!map.has(key)) map.set(key, { nameEn: item.nameEn, nameMr: item.nameMr, category: item.category, qty: 0, sales: 0 });
      const row = map.get(key);
      row.qty += number(item.qty);
      row.sales += number(item.lineTotal);
    }));
    rows = [...map.values()].sort((a,b) => b.sales - a.sales);
  } else if (reportState.type === 'payments') {
    const map = new Map();
    bills.forEach(bill => {
      const key = bill.paymentMode || 'cash';
      if (!map.has(key)) map.set(key, { mode: key, bills: 0, received: 0, due: 0 });
      const row = map.get(key);
      row.bills += 1; row.received += number(bill.amountReceived); row.due += number(bill.due);
    });
    rows = [...map.values()].sort((a,b) => b.received - a.received);
  } else {
    rows = bills;
  }
  return { from, to, bills, summary, rows };
}

function updateCouponStatus(id, status) {
  const bill = findBill(id);
  if (!bill) return;
  bill.couponStatus = status;
  bill.couponUpdatedAt = new Date().toISOString();
  saveState(); render(); showToast(status === 'served' ? t('servedNow') : 'Order started.', 'success');
}

function renderReportTable(data) {
  if (!data.rows.length) return `<div class="empty-state"><div class="empty-icon">📊</div>${esc(t('noReportData'))}</div>`;

function renderModal() {
  const root = document.getElementById('modal-root');
  if (!modalState) { root.innerHTML = ''; return; }
  if (modalState.type === 'success') {
    const bill = modalState.bill;
    root.innerHTML = `<div class="modal-backdrop" data-action="modal-backdrop"><div class="modal success-modal" role="dialog" aria-modal="true"><div class="modal-body"><div class="success-visual">✓</div><h3>${esc(t('billSaved'))}</h3><p class="success-copy">${esc(t('couponReady'))}</p><div class="ticket-ids"><div class="ticket-id"><span>${esc(t('billNumber'))}</span><strong>${esc(bill.billNo)}</strong></div><div class="ticket-id"><span>${esc(t('coupon'))}</span><strong>${esc(bill.couponNo)}</strong></div></div><div class="success-actions"><button class="btn btn-secondary" data-action="print-bill" data-id="${esc(bill.id)}">🖨 ${esc(t('printCombined'))}</button><button class="btn btn-primary" data-action="download-bill-pdf" data-id="${esc(bill.id)}">⇩ ${esc(t('downloadPdf'))}</button></div><div class="inline-alert info" style="text-align:left;margin-top:18px">ℹ️ The printed bill has full amounts. The coupon section at the bottom has only bilingual item names and quantities—no prices.</div></div><div class="modal-foot"><button class="btn btn-ghost" data-action="close-modal">${esc(t('close'))}</button><button class="btn btn-primary" data-action="new-bill-after-save">＋ ${esc(t('newBill'))}</button></div></div></div>`;
    return;
  }
  if (modalState.type === 'confirm') {
    root.innerHTML = `<div class="modal-backdrop" data-action="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><h3>${esc(modalState.title)}</h3><p>${esc(modalState.message)}</p></div><button class="icon-btn" data-action="close-modal">×</button></div><div class="modal-foot"><button class="btn btn-secondary" data-action="close-modal">${esc(t('noKeep'))}</button><button class="btn btn-danger" data-action="confirm-modal">${esc(modalState.confirmLabel || t('confirmDelete'))}</button></div></div></div>`;
    return;

function addToCart(id) {
  const item = getMenuItem(id);
  if (!item || item.active === false) return;
  const existing = billingDraft.cart.find(line => line.id === id);
  if (existing) existing.qty += 1;
  else billingDraft.cart.push({ id, qty: 1 });

function updateCart(id, delta) {
  const line = billingDraft.cart.find(item => item.id === id);
  if (!line) return;
  line.qty += delta;
  if (line.qty <= 0) billingDraft.cart = billingDraft.cart.filter(item => item.id !== id);
  render();
}

function openPrintWindow(html, title) {
  // Print from this same page so the device/browser system print dialog opens.
  // No popup or second browser window is created.
  const parsed = new DOMParser().parseFromString(html, 'text/html');
  const host = document.createElement('div');
  host.id = 'print-host';
  host.innerHTML = parsed.body ? parsed.body.innerHTML : html;
  const printStyles = [];
  parsed.head?.querySelectorAll('style').forEach(sourceStyle => {
    const style = document.createElement('style');
    style.dataset.printStyle = 'true';
    style.textContent = sourceStyle.textContent;
    document.head.appendChild(style);
    printStyles.push(style);
  });
  document.body.appendChild(host);
  const oldTitle = document.title;
  let cleaned = false;
  const cleanup = () => {
    if (cleaned) return;
    cleaned = true;
    document.body.classList.remove('is-printing');
    host.remove();
    printStyles.forEach(style => style.remove());
    document.title = oldTitle;
    window.removeEventListener('afterprint', cleanup);
  };
  document.title = title;
  document.body.classList.add('is-printing');
  window.addEventListener('afterprint', cleanup);
  // This opens the normal printer selection/system dialog for the current device.
  requestAnimationFrame(() => window.print());
  // Some mobile browsers do not emit afterprint; clean up after the dialog closes.
  setTimeout(cleanup, 120000);
}

function pdfSafe(text) {
  return String(text ?? '').replace(/[^\x20-\x7E]/g, '?');
}

function wrapText(text, max = 92) {
  const words = pdfSafe(text).split(/\s+/);
  const lines = [];
  let current = '';
  words.forEach(word => {
    if (!word) return;
    if ((current + ' ' + word).trim().length > max) { if (current) lines.push(current); current = word; }
    else current = (current + ' ' + word).trim();
  });
  if (current) lines.push(current);
  return lines.length ? lines : [''];
}

function pdfEscape(text) {
  return pdfSafe(text).replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
}

function createTextPdf(lines, title = 'Origo report') {
  const usable = [];
  lines.forEach(line => wrapText(line).forEach(wrapped => usable.push(wrapped)));
  const perPage = 51;
  const pageLines = [];
  for (let i = 0; i < usable.length; i += perPage) pageLines.push(usable.slice(i, i + perPage));
  if (!pageLines.length) pageLines.push(['']);
  const objects = [];
  objects[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  objects[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>';
  const pageIds = [];
  pageLines.forEach((page, index) => {
    const pageId = 4 + index * 2;
    const contentId = pageId + 1;
    pageIds.push(pageId);
    const contentLines = ['BT', '/F1 10 Tf', '40 790 Td', '0 -14 Td'];
    page.forEach((line, lineIndex) => {
      if (lineIndex === 0 && index === 0) contentLines.push('/F1 14 Tf');
      if (lineIndex === 1 && index === 0) contentLines.push('/F1 10 Tf');
      contentLines.push(`(${pdfEscape(line)}) Tj`, '0 -14 Td');
    });
    contentLines.push('ET');
    const stream = contentLines.join('\n');
    objects[pageId] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 842] /Resources << /Font << /F1 3 0 R >> >> /Contents ${contentId} 0 R >>`;
    objects[contentId] = `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`;
  });
  objects[2] = `<< /Type /Pages /Kids [${pageIds.map(id => `${id} 0 R`).join(' ')}] /Count ${pageIds.length} >>`;
  // Keep the generated file ASCII-only so xref byte offsets remain correct in every browser.
  let pdf = '%PDF-1.4\n';
  const offsets = [0];
  for (let i = 1; i < objects.length; i += 1) {
    if (!objects[i]) continue;
    offsets[i] = pdf.length;
    pdf += `${i} 0 obj\n${objects[i]}\nendobj\n`;
  }
  const xref = pdf.length;
  pdf += `xref\n0 ${objects.length}\n0000000000 65535 f \n`;
  for (let i = 1; i < objects.length; i += 1) pdf += `${String(offsets[i] || 0).padStart(10, '0')} 00000 n \n`;
  pdf += `trailer\n<< /Size ${objects.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return new Blob([pdf], { type: 'application/pdf' });
}

function marathiDate(value, withTime = false) {
  if (!value) return '—';
  const date = new Date(String(value).includes('T') ? value : `${value}T00:00:00`);
  if (Number.isNaN(date.getTime())) return String(value);
  return new Intl.DateTimeFormat('mr-IN', withTime
    ? { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }
    : { day: '2-digit', month: 'short', year: 'numeric' }).format(date);
}

function canvasWrapText(ctx, text, maxWidth, font) {
  ctx.font = font;
  const characters = Array.from(String(text ?? ''));
  const lines = [];
  let current = '';
  characters.forEach(character => {
    const next = current + character;
    if (current && ctx.measureText(next).width > maxWidth) {
      lines.push(current);
      current = character;
    } else current = next;
  });
  if (current || !lines.length) lines.push(current);
  return lines;
}

function jpegPdfFromDataUrl(dataUrl, widthPx, heightPx) {
  const base64 = String(dataUrl).split(',')[1] || '';
  const binary = atob(base64);
  const jpegBytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i += 1) jpegBytes[i] = binary.charCodeAt(i);
  const encoder = new TextEncoder();
  const ascii = text => encoder.encode(text);
  const pageWidth = 226.77; // 80 mm thermal-width PDF
  const pageHeight = Math.max(300, pageWidth * heightPx / widthPx);
  const content = `q\n${pageWidth.toFixed(2)} 0 0 ${pageHeight.toFixed(2)} 0 0 cm\n/Im0 Do\nQ\n`;
  const objects = {
    1: '<< /Type /Catalog /Pages 2 0 R >>',
    2: '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    3: `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageWidth.toFixed(2)} ${pageHeight.toFixed(2)}] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>`,
    4: `<< /Length ${content.length} >>\nstream\n${content}endstream`
  };
  const parts = [];
  const offsets = [0];
  let total = 0;
  const append = bytes => { parts.push(bytes); total += bytes.length; };
  append(ascii('%PDF-1.4\n'));
  for (let id = 1; id <= 4; id += 1) {
    offsets[id] = total;
    append(ascii(`${id} 0 obj\n${objects[id]}\nendobj\n`));
  }
  offsets[5] = total;
  append(ascii(`5 0 obj\n<< /Type /XObject /Subtype /Image /Width ${widthPx} /Height ${heightPx} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`));
  append(jpegBytes);
  append(ascii('\nendstream\nendobj\n'));
  const xrefOffset = total;
  append(ascii('xref\n0 6\n0000000000 65535 f \n'));
  for (let id = 1; id <= 5; id += 1) append(ascii(`${String(offsets[id]).padStart(10, '0')} 00000 n \n`));
  append(ascii(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`));
  return new Blob(parts, { type: 'application/pdf' });
}

async function buildMarathiBillPdf(bill) {
  if (!document.createElement) throw new Error('Canvas is not available.');
  const canvas = document.createElement('canvas');
  const width = 900;
  const padding = 58;
  const contentWidth = width - padding * 2;
  const family = '"Noto Sans Devanagari", "Nirmala UI", Mangal, Arial, sans-serif';
  const entries = [];
  const add = (text, size = 24, bold = false, align = 'left', color = '#172033') => {
    const font = `${bold ? '800' : '500'} ${size}px ${family}`;
    const probe = document.createElement('canvas').getContext('2d');
    const wrapped = canvasWrapText(probe, text, contentWidth, font);
    wrapped.forEach(line => entries.push({ type: 'text', text: line, size, bold, align, color, font }));
  };
  const rule = () => entries.push({ type: 'rule' });
  const blank = () => entries.push({ type: 'blank' });
  const itemName = item => item.nameMr ? `${item.nameEn} / ${item.nameMr}` : (item.nameEn || 'पदार्थ');
  const totalQty = bill.items.reduce((sum, item) => sum + number(item.qty), 0);
  add(state.settings.courtName, 31, true, 'center');
  add('बिल / CUSTOMER COPY', 23, true, 'center', '#c76805');
  blank();
  add(`बिल क्रमांक / Bill number: ${bill.billNo}`, 22, true);
  add(`दिनांक / Date: ${marathiDate(bill.createdAt, true)}`, 20);
  add(`ग्राहकाचे नाव / Customer: ${bill.customerName}`, 21);
  if (bill.mobile) add(`मोबाईल / Mobile: ${bill.mobile}`, 20);
  add(`कूपन क्रमांक / Coupon: ${bill.couponNo}`, 20);
  rule();
  add('पदार्थ / Item · प्रमाण / Quantity · रक्कम / Amount', 23, true);
  bill.items.forEach(item => add(`${itemName(item)}  × ${number(item.qty)}     ${money(item.lineTotal)}`, 20));
  add(`एकूण प्रमाण / Total quantity: ${totalQty}`, 21, true);
  rule();
  add(`उप-एकूण / Subtotal: ${money(bill.subtotal)}`, 21);
  add(`सूट / Discount: ${money(bill.discount)}`, 21);
  add(`जीएसटी / GST (${plainMoney(bill.gstRate)}%): ${money(bill.gstAmount)}`, 21);
  add(`अंतिम रक्कम / Grand total: ${money(bill.grandTotal)}`, 28, true, 'left', '#159570');
  add(`पेमेंट / Payment: ${bill.paymentMode === 'upi' ? 'यूपीआय / UPI' : 'रोख / Cash'} · ${bill.status === 'paid' ? 'भरले / PAID' : bill.status === 'partial' ? 'अंशतः / PARTIAL' : 'बाकी / DUE'}`, 21);
  if (bill.paymentMode === 'cash') {
    add(`मिळालेली रक्कम / Received: ${money(bill.amountReceived)}`, 21);
    add(`परत द्यायची रक्कम / Change: ${money(bill.change)}`, 21);
  }
  if (bill.due > 0) add(`बाकी रक्कम / Due: ${money(bill.due)}`, 22, true, 'left', '#d93c50');
  if (bill.notes) { rule(); add(`नोंद / Notes: ${bill.notes}`, 20); }
  rule();
  add(state.settings.footerMr || 'आज आमच्यासोबत जेवण केल्याबद्दल धन्यवाद.', 21, true, 'center');
  add('Thank you for having food with us today.', 18, true, 'center');
  add('विकलेला माल परत घेतला जाणार नाही. निघण्यापूर्वी ऑर्डर तपासा.', 16, false, 'center', '#6d778a');
  rule();
  add('कूपन / COUPON', 26, true, 'center', '#c76805');
  add(`कूपन कोड / Coupon code: ${bill.couponNo}`, 23, true, 'center');
  add('पदार्थ / Food and beverage · प्रमाण / Quantity', 20, true);
  bill.items.forEach(item => add(`${itemName(item)}  × ${number(item.qty)}`, 20));
  add(`एकूण प्रमाण / Total quantity: ${totalQty}`, 21, true, 'center');
  const lineHeight = 42;
  const ruleHeight = 25;
  const blankHeight = 18;
  const height = padding * 2 + entries.reduce((sum, entry) => sum + (entry.type === 'rule' ? ruleHeight : entry.type === 'blank' ? blankHeight : lineHeight), 0);
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  if (!ctx) throw new Error('Canvas context is not available.');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, width, height);
  ctx.textBaseline = 'top';
  let y = padding;
  entries.forEach(entry => {
    if (entry.type === 'blank') { y += blankHeight; return; }
    if (entry.type === 'rule') { ctx.strokeStyle = '#cbd2df'; ctx.setLineDash([8, 7]); ctx.beginPath(); ctx.moveTo(padding, y + 7); ctx.lineTo(width - padding, y + 7); ctx.stroke(); ctx.setLineDash([]); y += ruleHeight; return; }
    ctx.font = entry.font; ctx.fillStyle = entry.color;
    const textWidth = ctx.measureText(entry.text).width;
    const x = entry.align === 'center' ? (width - textWidth) / 2 : padding;
    ctx.fillText(entry.text, Math.max(padding, x), y);
    y += lineHeight;
  });
  return jpegPdfFromDataUrl(canvas.toDataURL('image/jpeg', 0.92), canvas.width, canvas.height);
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function reportExportRows(data) {
  if (reportState.type === 'products' || reportState.type === 'beverages') return data.rows.map(row => ({ itemEnglish: row.nameEn, itemMarathi: row.nameMr, category: row.category, quantity: row.qty, sales: plainMoney(row.sales) }));
  if (reportState.type === 'payments') return data.rows.map(row => ({ paymentMode: row.mode, bills: row.bills, received: plainMoney(row.received), due: plainMoney(row.due) }));
  return data.rows.map(bill => ({ date: bill.date, billNumber: bill.billNo, couponNumber: bill.couponNo, customerName: bill.customerName, mobile: bill.mobile, items: bill.items.map(item => `${item.nameEn} x ${item.qty}`).join(' | '), subtotal: plainMoney(bill.subtotal), discount: plainMoney(bill.discount), gst: plainMoney(bill.gstAmount), total: plainMoney(bill.grandTotal), paymentMode: bill.paymentMode, received: plainMoney(bill.amountReceived), due: plainMoney(bill.due), status: bill.status }));
}

function csvFromObjects(rows) {
  if (!rows.length) return '\ufeffNo records\n';
  const headers = Object.keys(rows[0]);
  const quote = value => `"${String(value ?? '').replace(/"/g, '""')}"`;
  return '\ufeff' + [headers.map(quote).join(','), ...rows.map(row => headers.map(header => quote(row[header])).join(','))].join('\n');
}

function exportReport(format) {
  const data = getReportData();
  const rows = reportExportRows(data);
  const stamp = `${data.from}_to_${data.to}`;
  if (format === 'csv') downloadBlob(new Blob([csvFromObjects(rows)], { type: 'text/csv;charset=utf-8' }), `origo-report-${stamp}.csv`);
  else if (format === 'json') {
    const payload = { app: 'Origo Breakfast Food Court', exportedAt: new Date().toISOString(), filters: reportState, summary: data.summary, rows };
    downloadBlob(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }), `origo-report-${stamp}.json`);
  } else {
    downloadBlob(createTextPdf(reportPdfLines(data)), `origo-report-${stamp}.pdf`);
  }
  showToast(t('reportExported'), 'success');
}

function reportPdfLines(data) {
  const lines = [`${state.settings.courtName} - ${reportTypeLabel(reportState.type)}`, `Period: ${data.from} to ${data.to}`, `Records: ${data.summary.count}`, `Gross sales: ${money(data.summary.gross)}`, `Received: ${money(data.summary.received)}`, `Open dues: ${money(data.summary.due)}`, '----------------------------------------------'];
  if (reportState.type === 'products' || reportState.type === 'beverages') data.rows.forEach(row => lines.push(`${row.nameEn} | Qty ${row.qty} | ${money(row.sales)}`));
  else if (reportState.type === 'payments') data.rows.forEach(row => lines.push(`${row.mode.toUpperCase()} | Bills ${row.bills} | Received ${money(row.received)} | Due ${money(row.due)}`));
  else data.rows.forEach(bill => lines.push(`${bill.date} | ${bill.billNo} | ${bill.customerName} | ${money(bill.grandTotal)} | ${bill.status}`));
  return lines;
}

async function whatsappReport() {
  if (session.role !== 'owner') { authRole = 'owner'; showAuthGate(); return; }
  const data = getReportData();
  const stamp = `${data.from}_to_${data.to}`;
  const blob = createTextPdf(reportPdfLines(data));
  const filename = `origo-report-${stamp}.pdf`;
  const message = `Origo अहवाल · ${data.from} ते ${data.to} · ${data.summary.count} रेकॉर्ड · एकूण विक्री ${money(data.summary.gross)}.`;
  try {
    const file = new File([blob], filename, { type: 'application/pdf' });
    if (navigator.share && (!navigator.canShare || navigator.canShare({ files: [file] }))) {
      await navigator.share({ title: 'Origo अहवाल', text: message, files: [file] });
      showToast(t('reportExported'), 'success');
      return;
    }
  } catch (error) {
    if (error && error.name === 'AbortError') return;
    console.warn('Native report share unavailable', error);
  }
  downloadBlob(blob, filename);
  window.open(`https://wa.me/?text=${encodeURIComponent(message + ' PDF डाउनलोड करून WhatsApp मध्ये जोडा.')}`, '_blank', 'noopener,noreferrer');
  showToast(t('fileReady'), 'success');
}

function restoreBackup(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed || !Array.isArray(parsed.bills) || !Array.isArray(parsed.menu) || !Array.isArray(parsed.inventory) || !parsed.settings) throw new Error('invalid');
      state = { ...makeDefaultState(), ...parsed, settings: { ...defaultSettings(), ...parsed.settings } };
      saveState();
      session.view = 'dashboard';
      render();
      showToast(t('backupRestored'), 'success');
    } catch (error) { showToast(t('backupInvalid'), 'error'); }
  };
  reader.readAsText(file);
}

function saveEditedBill(form) {
  const bill = findBill(form.elements.billId.value);
  if (!bill) return;
  bill.customerName = form.elements.customerName.value.trim() || bill.customerName;
  bill.mobile = form.elements.mobile.value.trim();
  bill.items = bill.items.map((item, index) => {
    const qty = Math.max(1, Math.floor(number(form.elements[`itemQty-${index}`]?.value, item.qty)));
    const rate = number(item.rate, item.qty ? number(item.lineTotal) / item.qty : 0);
    return { ...item, qty, rate, lineTotal: rate * qty };
  });
  bill.subtotal = bill.items.reduce((sum, item) => sum + number(item.lineTotal), 0);
  bill.discount = Math.min(Math.max(number(bill.discount), 0), bill.subtotal);
  bill.taxable = Math.max(bill.subtotal - bill.discount, 0);
  bill.gstAmount = bill.taxable * number(bill.gstRate) / 100;
  bill.grandTotal = bill.taxable + bill.gstAmount;
  bill.paymentMode = form.elements.paymentMode.value;
  bill.amountReceived = bill.paymentMode === 'upi' ? bill.grandTotal : Math.max(number(form.elements.amountReceived.value), 0);
  bill.change = Math.max(bill.amountReceived - bill.grandTotal, 0);
  bill.due = Math.max(bill.grandTotal - bill.amountReceived, 0);
  bill.status = bill.due <= 0.005 ? 'paid' : bill.amountReceived > 0 ? 'partial' : 'due';
  bill.updatedAt = new Date().toISOString();
  saveState(); modalState = null; render(); showToast('Bill updated.', 'success');
}

function settleBill(form) {
  const bill = findBill(form.elements.billId.value);
  if (!bill) return;
  bill.paymentMode = form.elements.paymentMode.value;
  bill.amountReceived = bill.grandTotal;
  bill.change = 0;
  bill.due = 0;
  bill.status = 'paid';
  bill.settledAt = new Date().toISOString();
  saveState(); modalState = null; render(); showToast(t('settled'), 'success');
}

function handleClick(event) {
  const actionEl = event.target.closest('[data-action]');
  if (!actionEl) return;
  const action = actionEl.dataset.action;
  if (!(actionEl.tagName === 'INPUT' && actionEl.type === 'file') && action !== 'language' && action !== 'auth-role' && action !== 'modal-backdrop') event.preventDefault();
  switch (action) {
    case 'language':
      state.settings.language = actionEl.dataset.lang === 'mr' ? 'mr' : 'en'; saveState(); render(); break;
    case 'navigate': navigate(actionEl.dataset.view); break;
    case 'show-view-menu': modalState = { type: 'view-menu' }; renderModal(); break;
    case 'history-search': render(); break;
    case 'history-clear': historySearch = ''; render(); break;
    case 'adjust-inventory': adjustInventory(actionEl.dataset.id, actionEl.dataset.delta); break;
    case 'start-coupon': updateCouponStatus(actionEl.dataset.id, 'in-progress'); break;
    case 'open-view': modalState = null; navigate(actionEl.dataset.view); break;
    case 'edit-bill': { const bill = findBill(actionEl.dataset.id); if (bill) { modalState = { type: 'edit-bill', bill }; renderModal(); } break; }
    case 'settle-bill': { const bill = findBill(actionEl.dataset.id); if (bill) { modalState = { type: 'settle-bill', bill }; renderModal(); } break; }
    case 'close-tab': { const closing = actionEl.dataset.view; openTabs = openTabs.filter(view => view !== closing); if (session.view === closing) session.view = openTabs[openTabs.length - 1] || 'dashboard'; render(); break; }
    case 'logout': session.role = null; session.view = 'dashboard'; openTabs = ['dashboard']; authRole = 'staff'; render(); break;
    case 'auth-role': authRole = actionEl.dataset.role === 'owner' ? 'owner' : 'staff'; showAuthGate(); break;
    case 'add-menu': addToCart(actionEl.dataset.id); break;
    case 'menu-category': menuCategory = actionEl.dataset.category || 'all'; render(); break;
    case 'cart-plus': updateCart(actionEl.dataset.id, 1); break;
    case 'cart-minus': updateCart(actionEl.dataset.id, -1); break;
    case 'cart-remove': billingDraft.cart = billingDraft.cart.filter(item => item.id !== actionEl.dataset.id); render(); break;
    case 'clear-cart': resetBill(); break;
    case 'fill-total': billingDraft.amountReceived = plainMoney(calculateBilling().total); render(); break;
    case 'save-bill': createBill(); break;
    case 'print-bill': printBill(actionEl.dataset.id); break;
    case 'download-bill-pdf': downloadBillPdf(actionEl.dataset.id); break;
    case 'print-last': printLast(); break;
    case 'mark-served': updateCouponStatus(actionEl.dataset.id, 'served'); break;
    case 'edit-inventory': inventoryEditingId = actionEl.dataset.id; session.view = 'inventory'; render(); break;
    case 'cancel-inventory-edit': inventoryEditingId = null; render(); break;
    case 'delete-inventory': {
      const item = state.inventory.find(i => i.id === actionEl.dataset.id); if (item) { modalState = { type: 'confirm-inventory', id: item.id, itemName: item.nameEn }; renderModal(); } break;
    }
    case 'confirm-remove-inventory': {
      state.inventory = state.inventory.filter(item => item.id !== modalState.id); inventoryEditingId = null; saveState(); modalState = null; render(); showToast(t('deleted'), 'success'); break;
    }
    case 'edit-menu': menuEditingId = actionEl.dataset.id; render(); break;
    case 'cancel-menu-edit': menuEditingId = null; render(); break;
    case 'delete-menu': {
      const item = state.menu.find(i => i.id === actionEl.dataset.id); if (item) { modalState = { type: 'confirm-menu', id: item.id, itemName: `${item.nameEn} · ${item.nameMr || ''}` }; renderModal(); } break;
    }
    case 'confirm-remove-menu': state.menu = state.menu.filter(item => item.id !== modalState.id); menuEditingId = null; saveState(); modalState = null; render(); showToast(t('deleted'), 'success'); break;
    case 'report-type': reportState.type = actionEl.dataset.type || 'bills'; render(); break;
    case 'report-csv': exportReport('csv'); break;
    case 'report-json': exportReport('json'); break;
    case 'report-pdf': exportReport('pdf'); break;
    case 'report-whatsapp': whatsappReport(); break;
    case 'download-backup': downloadBackup(); break;
    case 'restore-trigger': document.getElementById('restore-input')?.click(); break;
    case 'remove-logo': state.settings.logo = ''; saveState(); render(); showToast(t('deleted'), 'success'); break;
    case 'open-delete-data': if (session.role === 'owner') { modalState = { type: 'delete-data' }; renderModal(); } else { authRole = 'owner'; showAuthGate(); } break;
    case 'confirm-delete-data': confirmDeleteData(); break;
    case 'open-help': modalState = { type: 'help' }; renderModal(); break;
    case 'close-modal': modalState = null; renderModal(); break;
    case 'modal-backdrop': if (event.target === actionEl) { modalState = null; renderModal(); } break;
    case 'confirm-modal': if (modalState?.onConfirm) modalState.onConfirm(); break;
    case 'new-bill-after-save': modalState = null; session.view = 'billing'; render(); break;
    default: break;
  }
}

function handleInput(event) {
  const target = event.target;
  if (target.dataset.draft) {
    const key = target.dataset.draft;
    billingDraft[key] = target.type === 'checkbox' ? target.checked : target.value;
    if (key === 'paymentMode') { render(); return; }
    refreshBillingTotals();
  }
  if (target.dataset.historySearch !== undefined) historySearch = target.value;
  if (target.dataset.menuSearch !== undefined) {
    menuSearch = target.value;
    const grid = document.getElementById('menu-grid');
    if (grid) {
      const filtered = getActiveMenu().filter(item => {
        const term = menuSearch.trim().toLowerCase();
        return (!term || `${item.nameEn} ${item.nameMr}`.toLowerCase().includes(term)) && (menuCategory === 'all' || item.category === menuCategory);
      });
      grid.innerHTML = filtered.length ? filtered.map(renderMenuItemButton).join('') : `<div class="no-results" style="grid-column:1/-1">${esc(t('noItems'))}</div>`;
    }
  }
}

function refreshBillingTotals() {
  const calc = calculateBilling();
  const totals = document.getElementById('billing-totals');
  const change = document.getElementById('change-box');
  if (totals) totals.innerHTML = renderBillingTotals(calc);
  if (change) change.innerHTML = renderChangeBox(calc);
  const checkout = document.getElementById('checkout-btn');
  if (checkout) checkout.disabled = !calc.cartItems.length;
}

function handleChange(event) {
  const target = event.target;
  if (target.dataset.action === 'logo-upload' && target.files?.[0]) {
    const file = target.files[0];
    if (file.size > 2 * 1024 * 1024) { showToast('Logo must be smaller than 2 MB.', 'error'); return; }
    const reader = new FileReader();
    reader.onload = () => { state.settings.logo = reader.result; saveState(); render(); showToast('Logo saved.', 'success'); };
    reader.readAsDataURL(file);
  }
  if (target.dataset.action === 'restore-file' && target.files?.[0]) restoreBackup(target.files[0]);
  if (target.dataset.report) {
    if (target.dataset.report === 'preset') {
      reportState.preset = target.value;
      if (target.value !== 'custom') Object.assign(reportState, reportRangeFromPreset(target.value));
      render();
    } else reportState[target.dataset.report] = target.value;
  }
}

function handleSubmit(event) {
  event.preventDefault();
  const form = event.target;
  if (form.id === 'auth-form') return handleAuthSubmit(form);
  if (form.id === 'inventory-form') return saveInventoryForm(form);
  if (form.id === 'inventory-usage-form') return saveInventoryUsageForm(form);
  if (form.id === 'edit-bill-form') return saveEditedBill(form);
  if (form.id === 'settle-bill-form') return settleBill(form);
  if (form.id === 'business-form') return saveBusinessForm(form);
  if (form.id === 'security-form') return saveSecurityForm(form);
  if (form.id === 'menu-form') return saveMenuForm(form);
  if (form.id === 'report-filter-form') {
    const data = new FormData(form);
    reportState.preset = data.get('preset'); reportState.from = data.get('from'); reportState.to = data.get('to'); reportState.type = data.get('type');
    if (reportState.from > reportState.to) { const temp = reportState.from; reportState.from = reportState.to; reportState.to = temp; }
    render();
  }
}

function handleKeydown(event) {
  if (event.key === 'Escape' && modalState) { modalState = null; renderModal(); return; }
  if (event.key === 'F1') { event.preventDefault(); navigate('inventory'); return; }
  if (event.key === 'F2') { event.preventDefault(); navigate('billing'); return; }
  if (event.key === 'F3') { event.preventDefault(); navigate('history'); return; }
  if (event.key === 'F4') { event.preventDefault(); navigate('menu'); return; }
  if (event.key === 'F6') { event.preventDefault(); navigate('coupons'); return; }
  if (event.ctrlKey && event.key === 'Enter' && session.view === 'billing') { event.preventDefault(); createBill(); }
}

function applyRemoteState(remotePayload) {
  if (!remotePayload?.state || remotePayload.updatedBy === window.OrigoFirebase?.clientId) return;
  const remote = remotePayload.state;
  if (!Array.isArray(remote.menu) || !Array.isArray(remote.inventory) || !Array.isArray(remote.bills) || !remote.settings) return;
  const fresh = makeDefaultState();
  applyingRemoteState = true;
  state = {
    ...fresh,
    ...remote,
    settings: { ...fresh.settings, ...remote.settings },
    menu: remote.menu,
    inventory: remote.inventory,
    bills: remote.bills,
    nextBillSeq: Number(remote.nextBillSeq) || 1,
    nextCouponSeq: Number(remote.nextCouponSeq) || 1
  };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (error) { console.warn('Could not mirror Firebase state locally.', error); }
  applyingRemoteState = false;
  cloudSync.lastSync = new Date().toISOString();
  cloudSync.status = 'connected';
  render();
}

function initFirebaseSync() {
  const firebase = window.OrigoFirebase;
  if (!firebase?.enabled) {
    cloudSync.status = 'local';
    return;
  }
  cloudSync.status = firebase.status || 'connecting';
  render();
  firebase.ready.then(async ready => {
    if (!ready || !firebase.connected) {
      cloudSync.status = firebase.status === 'error' ? 'error' : 'local';
      cloudSync.error = firebase.error || 'Firebase is not connected.';
      render();
      return;
    }
    cloudSync.status = 'connected';
    render();
    const remote = await firebase.fetchState();
    if (remote?.state) applyRemoteState(remote);
    else {
      await firebase.saveState(state);
      cloudSync.lastSync = new Date().toISOString();
    }
    firebase.subscribe(applyRemoteState);
  }).catch(error => {
    cloudSync.status = 'error';
    cloudSync.error = error?.message || 'Firebase initialization failed.';
    render();
  });
}

window.addEventListener('origo-firebase-status', event => {
  cloudSync.status = event.detail?.status || 'local';
  cloudSync.error = event.detail?.error || '';
  if (cloudSync.status === 'connected') cloudSync.lastSync = new Date().toISOString();
  if (document.getElementById('topbar')) render();
});

document.addEventListener('click', handleClick);
document.addEventListener('input', handleInput);
document.addEventListener('change', handleChange);
document.addEventListener('submit', handleSubmit);
document.addEventListener('keydown', handleKeydown);

// Register the service worker when the app is served over HTTP(S). It is harmless in a local file preview.
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

render();
initFirebaseSync();
setInterval(() => { if (session.role === 'staff' && session.view === 'dashboard') render(); }, 60000);
